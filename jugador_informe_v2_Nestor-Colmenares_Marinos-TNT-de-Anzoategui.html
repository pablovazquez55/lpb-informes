.nojs{padding:24px 16px;font-size:15px}

#nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#nav .in{max-width:1100px;margin:0 auto;padding:7px 16px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin}
#nav a{flex:none;color:var(--tx2);text-decoration:none;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card);white-space:nowrap;cursor:pointer}

.kicker{font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.banner{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--tx2)}

.warn{font-size:12px;color:var(--am);margin:6px 0 0;line-height:1.4}
.bad{font-size:12px;color:var(--rs);margin:6px 0 0}
.note{font-size:12px;color:var(--mut);margin:6px 0 0;line-height:1.4}

.comp{margin-top:30px}

.desc{color:var(--mut);font-size:12.5px;margin:2px 0 10px}

<script>'use strict';

const D = window.__DATA__;
const META = D.meta, K = META.k, RES = D.resumen, J = D.jugador, EQ = D.equipo, CIF = D.cifras, GM = D.partidos, ONOFF = D.onoff;
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));


const MINUS = '−';
function nf(v, d) {
  if (v == null || !isFinite(v)) return '—';
  d = d == null ? 1 : d;
  let r = Number(v).toFixed(d);
  if (Number(r) === 0) r = (0).toFixed(d);
  return r.replace('.', ',');
}
function sg(v, d) {
  if (v == null || !isFinite(v)) return '—';
  d = d == null ? 1 : d;
  const r = Number(Math.abs(v).toFixed(d));
  return (r === 0 ? '' : v > 0 ? '+' : MINUS) + nf(Math.abs(v), d);
}
const pc = (v, d) => v == null || !isFinite(v) ? '—' : nf(v, d == null ? 1 : d) + ' %';
const ord = n => n + '.º';
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fdate = iso => { const p = iso.split('-'); return +p[2] + ' ' + MES[+p[1] - 1]; };
const mmss = m => { const s = Math.round(m * 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const short = t => (D.cortos && D.cortos[t]) || t;

function marcador(gm, resaltar) {
  const a = esc(short(gm.home)), b = esc(short(gm.away));
  return `${resaltar === gm.home ? `<b>${a}</b>` : a} ${gm.sh}–${gm.sa} ${resaltar === gm.away ? `<b>${b}</b>` : b}`;
}

const EV_MET = [
  {k: 'min', label: 'Minutos', f: v => nf(v, 1)},
  {k: 'pts', label: 'Puntos', f: v => nf(v, 0)},
  {k: 'reb', label: 'Rebotes', f: v => nf(v, 0)},
  {k: 'ast', label: 'Asistencias', f: v => nf(v, 0)},
  {k: 'val', label: 'Valoración (VAL)', f: v => nf(v, 0)},
  {k: 'usg', label: '%USO', f: v => pc(v, 1)}
];
function evVals(m) { return D.series[m.k].map(d => ({gid: d.gid, v: d.v, why: d.why, c: GM[d.gid]})); }
function evTip(m, d) {
  const c = d.c;
  return `<b>${esc(fdate(c.fecha))}</b> · ${esc(marcadorTxt(c))}<br>${c.won ? 'Victoria' : 'Derrota'} de su equipo<br>` + (d.v != null ? `${esc(m.label)}: <b>${m.f(d.v)}</b>` : `<i>${esc(d.why)}</i>`);
}
function lastVsMean(m) {
  const r = D.series_resumen[m.k];
  if (!r) return '<span class="mut">sin datos</span>';
  const f1 = v => m.k === 'usg' ? pc(v, 1) : nf(v, 1);
  return `último (${esc(fdate(GM[r.ultimo_gid].fecha))}): <b>${f1(r.ultimo)}</b> · media ${f1(r.media)} <span class="${r.ultimo - r.media >= 0 ? 'em' : 'rs'}">(${sg(r.ultimo - r.media, 1)})</span>`;
}
function miniChart(m, W, H) {
  const V = evVals(m), ok = V.filter(d => d.v != null), n = V.length;
  const L = 30, Rt = 10, T = 12, B = 22;
  const mx = Math.max(1, ...ok.map(d => d.v)) * 1.12, X = i => L + (W - L - Rt) * (n === 1 ? 0.5 : i / (n - 1)), Y = v => T + (H - T - B) * (1 - v / mx);
  const mean = ok.length ? D.series_resumen[m.k].media : null;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)} partido a partido">`;
  const tk = mx / 1.12 < 10 ? 1 : 0;
  [0, 0.5, 1].forEach(f => { const v = mx * f / 1.12, y = Y(v); s += `<line x1="${L}" x2="${W - Rt}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end">${nf(v, tk)}</text>`; });
  if (mean != null) s += `<line x1="${L}" x2="${W - Rt}" y1="${Y(mean).toFixed(1)}" y2="${Y(mean).toFixed(1)}" stroke="var(--am)" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  let path = '', pen = false;
  V.forEach((d, i) => { if (d.v == null) { pen = false; return; } path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d.v).toFixed(1); pen = true; });
  s += `<path d="${path}" fill="none" stroke="var(--tx2)" stroke-width="1.6" stroke-linejoin="round" stroke-opacity=".7"/>`;
  V.forEach((d, i) => {
    const x = X(i);
    s += `<text x="${x.toFixed(1)}" y="${H - 7}" text-anchor="middle">${i + 1}</text>`;
    if (d.v == null) { s += `<g data-tip="${esc(evTip(m, d))}"><rect x="${(x - 7).toFixed(1)}" y="${T}" width="14" height="${H - T - B}" fill="var(--mut)" fill-opacity=".10" rx="3"/><text x="${x.toFixed(1)}" y="${(Y(0) - 4).toFixed(1)}" text-anchor="middle" style="font-size:9px">—</text></g>`; return; }
    s += `<circle cx="${x.toFixed(1)}" cy="${Y(d.v).toFixed(1)}" r="5" fill="${d.c.won ? 'var(--win)' : 'var(--loss)'}" stroke="var(--card)" stroke-width="1.5" data-tip="${esc(evTip(m, d))}"/>`;
  });
  return s + '</svg>';
}
const evLegend = '<div class="legend2"><span><i style="background:var(--win);border-radius:50%"></i>victoria de su equipo</span><span><i style="background:var(--loss);border-radius:50%"></i>derrota</span><span><i style="background:var(--am);height:2px;margin-top:4px"></i>media</span><span><i style="background:var(--mut);opacity:.4"></i>hueco = no jugó</span><span>eje: número de partido del equipo (cronológico)</span><span>marcador siempre local–visitante</span></div>';
function c5() {
  return `<div class="sm6">${EV_MET.map(m => `<div class="mini"><h4>${esc(m.label)}</h4>${miniChart(m, 260, 130)}<div class="xs">${lastVsMean(m)}</div></div>`).join('')}</div>${evLegend}
  <p class="note">Con ${RES.pj} partidos jugados una «tendencia» es ruido: no se calcula ninguna. Solo se compara el último partido con la media. Los partidos sin jugar se marcan con hueco, nunca como cero.</p>`;
}


const C6COLS = [
  {k: 'min', h: 'MIN', tip: 'Minutos jugados', f: v => mmss(v)},
  {k: 'pts', h: 'PTS', tip: 'Puntos', f: v => nf(v, 0)},
  {k: 'reb', h: 'REB', tip: 'Rebotes', f: v => nf(v, 0)},
  {k: 'ast', h: 'AST', tip: 'Asistencias', f: v => nf(v, 0)},
  {k: 'stl', h: 'ROB', tip: 'Robos', f: v => nf(v, 0)},
  {k: 'tov', h: 'PER', tip: 'Pérdidas (menos es mejor)', f: v => nf(v, 0)},
  {k: 'ts', h: 'TS %', tip: 'Acierto de tiro real', f: v => pc(v, 1), ratio: true},
  {k: 'efg', h: 'eFG %', tip: 'Acierto de tiro efectivo', f: v => pc(v, 1), ratio: true},
  {k: 'usg', h: '%USO', tip: 'Uso de posesiones', f: v => pc(v, 1), ratio: true},
  {k: 'ast_pct', h: 'AST %', tip: 'Porcentaje de canastas de sus compañeros que asiste', f: v => pc(v, 1), ratio: true},
  {k: 'tov_pct', h: 'TOV %', tip: 'Pérdidas por posesión usada (menos es mejor)', f: v => pc(v, 1), ratio: true},
  {k: 'pm', h: '+/-', tip: 'Más-menos del acta (puntos del equipo menos los del rival con él en pista)', f: v => sg(v, 0)},
  {k: 'val', h: 'VAL', tip: 'Valoración del acta', f: v => nf(v, 0)}
];
let SORT6 = {k: 'date', dir: 1};
function c6Note() {
  return `<p class="note">Ratios (TS %, eFG %, %USO, AST %, TOV %) solo con al menos <b>${META.min_ratio} min</b> jugados en ese partido: con menos, un solo tiro daría un 100 % que no significa nada y se muestra «—». Mejor y peor partido por VAL; si empatan, el de más puntos y luego el más reciente. +/- siempre el del acta. Última fila: promedio por partido; los porcentajes son el acumulado de todos sus minutos.</p>`;
}
function c6Table() {
  const L = D.listado;
  const rows = L.filas.slice();
  const key = SORT6.k;
  rows.sort((a, b) => {
    const va = key === 'date' ? GM[a.gid].fecha + a.gid : a[key], vb = key === 'date' ? GM[b.gid].fecha + b.gid : b[key];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * SORT6.dir;
  });
  const th = (k, h, tip, l) => `<th ${l ? 'class="l"' : ''} data-sort="${k}" tabindex="0" aria-sort="${SORT6.k === k ? (SORT6.dir > 0 ? 'ascending' : 'descending') : 'none'}" data-tip="${esc(tip)}">${esc(h)}${SORT6.k === k ? (SORT6.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const head = `<tr>${th('date', 'Fecha y partido (local–visitante)', 'Ordenar por fecha', true)}<th>Res.</th>${C6COLS.map(c => th(c.k, c.h, c.tip)).join('')}</tr>`;
  const body = rows.map(r => {
    const gm = GM[r.gid], mejor = r.gid === L.mejor, peor = r.gid === L.peor;
    const tag = mejor ? ' <span class="tag" style="color:var(--em);border-color:var(--em)">mejor</span>' : peor ? ' <span class="tag" style="color:var(--rs);border-color:var(--rs)">peor</span>' : '';
    return `<tr class="${mejor ? 'best' : peor ? 'worst' : ''}"><td class="l" style="white-space:normal;min-width:190px">${esc(fdate(gm.fecha))} · ${marcador(gm, J.equipo)}${tag}</td>
      <td><span class="pill ${gm.won ? 'v' : 'd'}">${gm.won ? 'V' : 'D'}</span></td>
      ${C6COLS.map(c => { const v = r[c.k]; return `<td ${c.ratio && v == null ? `data-tip="${esc('Menos de ' + META.min_ratio + ' min: ratio sin valor')}"` : ''}>${v == null ? '—' : c.f(v)}</td>`; }).join('')}</tr>`;
  }).join('');
  const gaps = L.huecos.map(g => { const gm = GM[g.gid];
    return `<tr class="gap"><td class="l" colspan="${C6COLS.length + 2}">${esc(fdate(gm.fecha))} · ${marcador(gm, J.equipo)} — no jugó (${g.motivo === 'sin_minutos' ? 'figura en el acta con 0:00' : 'no figura en el acta'})</td></tr>`; }).join('');
  const T = L.promedio;
  const tot = `<tr style="font-weight:700"><td class="l">Promedio por partido (${RES.pj} jugados)</td><td></td>${C6COLS.map(c => `<td>${c.k === 'min' ? nf(T.min, 1) : c.k === 'pm' ? sg(T.pm, 1) : c.ratio ? pc(T[c.k], 1) : nf(T[c.k], 1)}</td>`).join('')}</tr>`;
  return `<div class="scrollx"><table class="t" data-c6="A"><thead>${head}</thead><tbody>${body}${gaps}${tot}</tbody></table></div>`;
}
function c6() { return c6Table() + c6Note(); }


const EJES_DETALLE = () => `<details><summary>Cómo se compone cada eje (definición propia, no de la liga)</summary><dl>${D.ejes.map(er =>
  `<dt>${esc(EJE[er.k].label)}</dt><dd>${esc(EJE[er.k].desc)} <span class="mut">Promedio simple de la nota de: ${er.met.map(k => esc(MET[k].label)).join(' + ')}.</span></dd>`).join('')}</dl></details>`;

const COMPS = [
  {id: 'c1', nav: 'Cabecera', title: 'Cabecera y tarjetas de cifras', desc: 'La primera pantalla del informe: quién es el jugador y cuánto produce por partido.',
   que: () => `<b>Qué mide.</b> Quién es el jugador y cuánto produce en un partido normal. Puntos, rebotes, asistencias y valoración (VAL: la «nota de eficiencia» que ya calcula el acta oficial) son <b>promedios por partido jugado</b>. El <b>puesto</b> («1.º de ${CIF.pts_pj.n}») ordena al jugador entre los <b>jugadores comparables</b> en esa cifra (${esc(reglaCorta())}). El número de comparables se enseña siempre; quien no llega al mínimo conserva su cifra, pero sin puesto. En cada barra, el rango es el del grupo real: del comparable con la cifra más baja al de la más alta, con la raya de la media.`,
   r: c1},
  {id: 'c2', nav: 'Perfil', title: 'Perfil de 7 ejes con nota de 0 a 10', desc: 'El retrato del jugador: en qué es bueno y en qué no, frente al resto del grupo.',
   que: () => `<b>Qué mide.</b> Un resumen del estilo y el nivel del jugador en 7 rasgos. La <b>nota</b> sale de ordenar a todo el grupo: un 8 significa «mejor que el 80 % de los jugadores del grupo»; un 5, «justo en la mitad». Cada rasgo mezcla una a tres cifras <b>por 40 minutos</b>, para que quien juega poco se compare en igualdad con quien juega mucho. <b>Aviso:</b> «Defensa» solo mide robos y tapones, no la defensa completa. ${EJES_DETALLE()}`,
   r: c2},
  {id: 'c3', nav: 'Fortalezas', title: 'Fortalezas y debilidades', desc: 'Lo que mejor y peor hace, con su puesto en la liga.',
   que: () => `<b>Qué mide.</b> Las 3 cosas que mejor hace y las 3 que peor, frente al resto del grupo. Se evalúan 12 cifras con dirección clara (por 40 minutos o porcentajes), las 12 ordenadas de mejor a peor. Las que no son buenas ni malas por sí mismas (cuántos triples tira, cuánto balón usa) <b>no entran</b>. En pérdidas y faltas, <b>menos es mejor</b> y ya viene invertido. Si a un jugador le faltan intentos o minutos (por ejemplo, menos de ${nf(K.MIN_3PA_PG, 1)} triples por partido) esa cifra no se clasifica y se dice por qué. Cada cifra se compara solo con los jugadores comparables en ella (el número de comparables se ve en cada línea).`,
   r: c3},
  {id: 'c4', nav: 'Impacto', title: 'Impacto con y sin el jugador', desc: 'Qué le pasa al equipo cuando el jugador está en pista y cuando no.',
   que: () => `<b>Qué mide.</b> Cómo rinde el equipo con el jugador en pista y sin él. <b>Ataque</b> = puntos que anota el equipo por cada 100 ataques; <b>defensa</b> = puntos que recibe por cada 100 ataques (menos es mejor); <b>neto</b> = ataque menos defensa; <b>ritmo</b> = ataques por 40 minutos (un ataque = tiro de campo + 0,44 × tiro libre + pérdida − rebote ofensivo; se usa la media de los dos equipos). Los minutos y el +/- son los del acta; lo demás se reconstruye del historial jugada a jugada. <b>Aviso:</b> los partidos cuya acta se cerró antes de tiempo quedan fuera del con/sin; si alguno es de este equipo, se indica debajo.`,
   r: c4},
  {id: 'c5', nav: 'Evolución', title: 'Evolución partido a partido', desc: 'Cómo ha ido de un partido al siguiente.',
   que: () => `<b>Qué mide.</b> Cómo cambian sus cifras de un partido al siguiente: minutos, puntos, rebotes, asistencias, valoración y uso de posesiones (%USO: qué parte de las jugadas de su equipo termina él con un tiro o una pérdida). Cada punto lleva el resultado de su equipo (victoria o derrota). <b>Aviso:</b> con pocos partidos una «tendencia» es ruido, así que no se calcula; solo se compara el último partido con la media. Si no jugó, se marca el hueco.`,
   r: c5},
  {id: 'c6', nav: 'Partidos', title: 'Listado de partidos avanzado', desc: 'El detalle de cada partido con las medidas avanzadas.',
   que: () => `<b>Qué mide.</b> Lo que hizo en cada partido, con las medidas avanzadas: <b>TS %</b> (acierto de tiro contando triples y tiros libres), <b>eFG %</b> (acierto de campo dando más valor al triple), <b>%USO</b> (cuánta ofensiva de su equipo termina él), <b>AST %</b> (qué parte de las canastas de sus compañeros asiste) y <b>TOV %</b> (cuántas posesiones pierde). El +/- es el del acta. Se destaca el mejor y el peor partido por VAL. Pulsa el título de una columna para ordenar. Con pocos minutos esas medidas no valen y salen como «—».`,
   r: c6}
];

const GLOS = [
  ['VAL (valoración)', 'La «nota de eficiencia» oficial del acta: puntos + rebotes + asistencias + robos + tapones + faltas recibidas, menos tiros fallados, pérdidas, tapones recibidos y faltas cometidas.'],
  ['Por 40 minutos', 'La cifra que tendría si jugara 40 minutos al mismo ritmo. Sirve para comparar a quien juega 12 minutos con quien juega 35.'],
  ['TS % (acierto de tiro real)', 'Puntos / (2 × (tiros de campo intentados + 0,44 × tiros libres intentados)). Premia el triple y los tiros libres.'],
  ['eFG % (acierto de tiro efectivo)', '(Canastas de campo + 0,5 × triples anotados) / tiros de campo intentados.'],
  ['%USO (uso de posesiones)', '100 × (tiros de campo + 0,44 × tiros libres + pérdidas) del jugador × (minutos del equipo / 5) / (minutos del jugador × lo mismo del equipo). No es ni bueno ni malo: dice cuánto balón maneja.'],
  ['AST %', 'Asistencias / (canastas de campo de sus compañeros mientras él está en pista).'],
  ['TOV %', 'Pérdidas / (tiros de campo + 0,44 × tiros libres + pérdidas). Menos es mejor.'],
  ['+/- del acta', 'Puntos del equipo menos los del rival mientras el jugador estaba en pista, tal como lo publica el acta oficial. Nunca se reconstruye.'],
  ['Ataque, defensa y neto', 'Puntos anotados (ataque) o recibidos (defensa) por cada 100 posesiones; neto = ataque − defensa. Posesión = tiros de campo + 0,44 × tiros libres + pérdidas − rebotes ofensivos.'],
  ['Con y sin', '«Con» son los minutos del jugador en pista; «sin» son el resto de minutos de su equipo en esos mismos partidos.'],
  ['Percentil (P) y nota', 'Percentil = % de jugadores comparables con un valor estrictamente peor. La nota de 0 a 10 es el percentil dividido entre 10. Por ejemplo, con 80 comparables el primero de la lista tiene percentil 98,8 (no 100): el 100 exigiría superar también a sí mismo.'],
  ['Puesto «1.º de 80»', 'Posición real entre los jugadores comparables en esa cifra (1.º = mejor); el segundo número es cuántos son. Quienes empatan comparten puesto.'],
  ['Jugadores comparables', 'Con pocos partidos o pocos minutos una cifra es azar, por eso no todos entran en cada comparación: solo los que alcanzan un mínimo de partidos jugados, de minutos por partido y, en los porcentajes, de intentos. Los mínimos concretos de este informe están en el recuadro del principio.'],
  ['Mejor y peor partido', 'Los de mayor y menor VAL. Si empatan, gana el de más puntos y, después, el más reciente.']
];


function build() {
  const nav = COMPS.map(c => `<a href="#${c.id}">${esc(c.nav)}</a>`).join('');
  $('#app').innerHTML =
    `<div class="kicker">Informe de jugador · ${esc(META.liga)} · ${META.n_partidos} partidos hasta el ${esc(fdate(META.corte))}</div><div id="banner">${banner()}</div>` +
    COMPS.map(c => `<section class="comp" id="${c.id}"><h2 class="cs">${esc(c.title)}</h2><p class="desc">${esc(c.desc)}</p><div class="que" id="q-${c.id}"></div><div class="vz" id="vz-${c.id}"></div></section>`).join('') +
    `<section class="comp" id="glosario"><details class="card"><summary>Glosario en palabras normales</summary><ul>${GLOS.map(([t, d]) => `<li><b>${esc(t)}.</b> ${esc(d)}</li>`).join('')}</ul></details></section>`;
  $('#navc').innerHTML = nav;
  $('#app').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (th) { const k = th.dataset.sort; SORT6 = {k, dir: SORT6.k === k ? -SORT6.dir : (k === 'date' ? 1 : -1)}; paintComp('c6'); }
  });
  $('#app').addEventListener('keydown', e => {
    const th = e.target.closest && e.target.closest('th[data-sort]');
    if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const k = th.dataset.sort; SORT6 = {k, dir: SORT6.k === k ? -SORT6.dir : (k === 'date' ? 1 : -1)}; paintComp('c6'); const t2 = $(`th[data-sort="${k}"]`); if (t2) t2.focus(); }
  });
  $('#app').addEventListener('mouseover', e => {
    $$('#app .hi').forEach(x => x.classList.remove('hi'));
    const el = e.target.closest('[data-eje]'); if (!el) return;
    const vz = el.closest('.vz'); if (vz) vz.querySelectorAll(`[data-eje="${el.dataset.eje}"]`).forEach(x => x.classList.add('hi'));
  });
}
function paintComp(id) {
  const c = COMPS.find(x => x.id === id);
  try { $('#vz-' + c.id).innerHTML = c.r(); } catch (e) { console.error(c.id, e); $('#vz-' + c.id).innerHTML = `<div class="bad">ERROR al dibujar ${c.id}: ${esc(e.message)}</div>`; }
  try { $('#q-' + c.id).innerHTML = c.que(); } catch (e) { console.error(c.id, 'qué mide', e); $('#q-' + c.id).innerHTML = `<div class="bad">ERROR en «Qué mide» de ${c.id}: ${esc(e.message)}</div>`; }
}
build();
COMPS.forEach(c => paintComp(c.id));
window.__LPB_JUGADOR__ = {D, COMPS, CIF, EJES};
</script></body></html>
